  <title id="title">QuietBar — A quieter menu bar for macOS</title>
  <desc id="desc">QuietBar project banner with a purple menu bar symbol. Experimental native macOS utility.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#13152b"/><stop offset="1" stop-color="#252344"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#a69aff"/><stop offset="1" stop-color="#7565f3"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="18" r="230" fill="#8271f3" opacity=".075"/>
  <circle cx="1080" cy="-10" r="162" fill="#b3a7ff" opacity=".055"/>
